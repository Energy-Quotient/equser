[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equser"
dynamic = ["version"]
description = "User toolkit for power quality data from EQ Wave sensors"
authors = [
    {name = "Energy Quotient", email = "info@eq.systems"},
]
maintainers = [
    {name = "Kevin Davies", email = "kdavies@eq.systems"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "power-quality",
    "energy",
    "monitoring",
    "waveform",
    "parquet",
    "data-acquisition",
    "electrical",
    "pq",
    "cpow",
    "continuous-waveform",
    "eq-wave",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# Base dependencies: data loading + waveform analysis + CLI essentials
dependencies = [
    "argcomplete>=3.5",
    "colorlog>=6.9",
    "numpy>=1.24",
    "pyarrow>=18.0,!=21.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Live sensor acquisition (+2MB)
daq = [
    "avro>=1.12",
    "fastavro>=1.9",
]
# Plotting + API client (+150MB)
analysis = [
    "matplotlib>=3.5",
    "requests>=2.28",
    "websocket-client>=1.6",
]
# Full notebook environment (superset of analysis, +300MB)
jupyter = [
    "equser[analysis]",
    "duckdb>=1.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.4",
    "nbconvert>=7.16",
]
# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Full installation (all optional deps except dev)
full = [
    "equser[daq,jupyter]",
]

[project.scripts]
equser = "equser.cli:main"

[project.urls]
Homepage = "https://eq.systems"
Documentation = "https://equser.eq.systems"
Repository = "https://github.com/Energy-Quotient/equser"
Changelog = "https://github.com/Energy-Quotient/equser/blob/main/CHANGELOG.md"
Issues = "https://github.com/Energy-Quotient/equser/issues"

[tool.hatch.version]
path = "equser/_version.py"

[tool.hatch.build]
# Include notebook files in the wheel even if .gitignore would exclude them
artifacts = ["equser/notebooks/**/*.ipynb"]

[tool.hatch.build.targets.sdist]
include = [
    "equser/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["equser"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E731"]  # Allow lambda assignments

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["equser"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
